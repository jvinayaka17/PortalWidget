<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOK Portal Assistant</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f6f9; padding: 40px;">

    <div style="max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
        <h2>Cadet Unit Portal (Test Page)</h2>
        <p>This is a test host page for the Portal chat widget. Look at the bottom right corner of your screen!</p>
    </div>

    <!-- NOK FLOATING CHAT WIDGET -->
    <style>
        #nok-chat-bubble {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background-color: #0078d4;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 99999;
            transition: transform 0.2s;
        }
        #nok-chat-bubble:hover { transform: scale(1.05); }

        #nok-chat-window-container {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 380px;
            height: 500px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            display: none;
            flex-direction: column;
            z-index: 99999;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
    </style>

    <!-- Floating Toggle Button -->
    <div id="nok-chat-bubble" onclick="toggleChatPopup()" title="Open Portal Assistant">💬</div>

    <!-- Floating Popup Container -->
    <div id="nok-chat-window-container">
        
        <!-- Popup Header -->
        <div style="background: #0078d4; color: white; padding: 12px; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: bold;">NOK Unit Assistant</span>
            <span onclick="toggleChatPopup()" style="cursor: pointer; font-size: 20px; font-weight: bold;">&times;</span>
        </div>

        <!-- VIEW 1: PIN AUTH GATE -->
        <div id="popup-auth-gate" style="padding: 30px; text-align: center; margin-top: 30px;">
            <h3>🔐 Security Verification</h3>
            <p style="font-size: 13px; color: #666; margin-bottom: 20px;">Please enter your Cadet PIN to unlock the assistant.</p>
            <input type="text" id="popup-pin-input" placeholder="Enter PIN (e.g., PIN1)" style="padding: 10px; width: 85%; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; text-align: center;" />
            <br><br>
            <button onclick="verifyPopupPin()" style="padding: 10px 20px; background: #0078d4; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Verify PIN</button>
            <p id="popup-error-msg" style="color: #d9534f; margin-top: 15px; font-size: 12px; font-weight: bold;"></p>
        </div>

        <!-- VIEW 2: CHAT INTERFACE -->
        <div id="popup-chat-interface" style="display: none; flex-direction: column; height: calc(100% - 45px);">
            <div id="popup-chat-history" style="flex: 1; padding: 15px; overflow-y: auto; background: #f9f9f9; display: flex; flex-direction: column; gap: 10px;">
                <div style="align-self: flex-start; background: #e2e8f0; color: #333; padding: 10px 12px; border-radius: 8px; max-width: 85%; font-size: 13px; line-height: 1.4;">
                    Hello! You are securely verified. How can I help you today?
                </div>
            </div>
            <div style="padding: 10px; background: white; border-top: 1px solid #ddd; display: flex; gap: 8px;">
                <input type="text" id="popup-user-input" placeholder="Type a message..." onkeypress="handlePopupKey(event)" style="flex: 1; padding: 9px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px;" />
                <button onclick="sendPopupMessage()" style="padding: 9px 14px; background: #0078d4; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Send</button>
            </div>
        </div>

    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('nok_verified') === 'true') {
                document.getElementById('popup-auth-gate').style.display = 'none';
                document.getElementById('popup-chat-interface').style.display = 'flex';
            }
        });

        function toggleChatPopup() {
            const box = document.getElementById('nok-chat-window-container');
            box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';
        }

        async function verifyPopupPin() {
            const pin = document.getElementById('popup-pin-input').value.trim();
            const errorMsg = document.getElementById('popup-error-msg');
            
            if (!pin) {
                errorMsg.innerText = "Please enter a PIN.";
                return;
            }
            
            errorMsg.innerText = "Verifying...";

            try {
                const response = await fetch('https://nokunitlookup-hba2e5gqhqgpg6a7.uksouth-01.azurewebsites.net/api/verify_nok', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin: pin })
                });
                const data = await response.json();

                if (data.success || data.verified || data.status === "success") {
                    sessionStorage.setItem('nok_verified', 'true');
                    document.getElementById('popup-auth-gate').style.display = 'none';
                    document.getElementById('popup-chat-interface').style.display = 'flex';
                } else {
                    errorMsg.innerText = "Invalid PIN. Please try again.";
                }
            } catch (err) {
                console.error(err);
                errorMsg.innerText = "Connection error validating PIN.";
            }
        }

        function handlePopupKey(e) {
            if (e.key === 'Enter') sendPopupMessage();
        }

        function sendPopupMessage() {
            const input = document.getElementById('popup-user-input');
            const history = document.getElementById('popup-chat-history');
            const text = input.value.trim();
            if (!text) return;

            history.innerHTML += `<div style="align-self: flex-end; background: #0078d4; color: white; padding: 10px 12px; border-radius: 8px; max-width: 85%; font-size: 13px; line-height: 1.4;">${escapeHtml(text)}</div>`;
            input.value = '';
            history.scrollTop = history.scrollHeight;

            setTimeout(() => {
                history.innerHTML += `<div style="align-self: flex-start; background: #e2e8f0; color: #333; padding: 10px 12px; border-radius: 8px; max-width: 85%; font-size: 13px; line-height: 1.4;">[Agent connection pending]: I received your message: "${escapeHtml(text)}"</div>`;
                history.scrollTop = history.scrollHeight;
            }, 600);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
